---
- name: Remove specific ports from firewalld docker zone
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Remove port 9443/tcp from docker zone
      ansible.posix.firewalld:
        zone: docker
        port: 9443/tcp
        state: absent
        permanent: yes

    - name: Remove port 3478/tcp from docker zone
      ansible.posix.firewalld:
        zone: docker
        port: 3478/tcp
        state: absent
        permanent: yes

    - name: Reload firewalld to apply changes
      ansible.posix.firewalld:
        state: reloaded
      # become is inherited from play

