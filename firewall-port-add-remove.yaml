---
- name: Remove specific ports from firewalld
  hosts: all
  become: yes
  become_user: root
  gather_facts: no

  tasks:
    - name: Remove ports 9443/tcp and 3478/tcp from firewalld (docker zone)
      shell: |
        firewall-cmd --permanent --zone=docker --remove-port=9443/tcp
        firewall-cmd --permanent --zone=docker --remove-port=3478/tcp

    - name: Reload firewalld
      shell: firewall-cmd --reload
