---
- name: Remove specific ports from firewalld using shell with sudo
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Remove ports 9443/tcp and 3478/tcp from firewalld (default zone)
      shell: firewall-cmd --permanent --remove-port=9443/tcp && firewall-cmd --permanent --remove-port=3478/tcp

    - name: Reload firewalld to apply changes
      shell: firewall-cmd --reload
