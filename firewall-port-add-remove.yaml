---
- name: Remove specific ports from firewalld using shell with sudo
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Remove ports 9443/tcp and 3478/tcp from firewalld in docker zone
      shell: |
        sudo firewall-cmd --permanent --zone=docker --remove-port={{ item }}/tcp
      with_items:
        - 9443
        - 3478
      register: remove_result
      ignore_errors: yes
      changed_when: remove_result.rc == 0

    - name: Reload firewalld to apply changes
      shell: sudo firewall-cmd --reload
      when: remove_result is defined and remove_result.rc == 0
