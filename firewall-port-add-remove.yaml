---
- name: Remove specific ports from firewalld
  hosts: all
  become: yes  # ensure sudo is used

  tasks:
    - name: Remove ports 9443/tcp and 3478/tcp from firewalld in docker zone
      command: firewall-cmd --permanent --zone=docker --remove-port={{ item }}/tcp
      with_items:
        - 9443
        - 3478
      register: removed_ports
      changed_when: "'success' in removed_ports.stdout|default('') or 'already' not in removed_ports.stdout|default('')"

    - name: Reload firewalld to apply changes
      command: firewall-cmd --reload
      when: removed_ports.changed
