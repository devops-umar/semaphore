---
- hosts: all
  become: true
  become_user: root
  become_method: sudo
  ignore_unreachable: true

  tasks:
    - name: Adding Sngrep Kill Cron
      cron:
        name: "Kill sngrep sessions after 15 minutes"
        user: root
        minute: "*/1"
        job: "sudo /usr/bin/pkill -o -15 -f 'sngrep'"
      ignore_errors: yes
