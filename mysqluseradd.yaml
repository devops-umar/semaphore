- name: Create MySQL user using root inside Docker container
  hosts: all
  become: yes
  vars_files:
    - vault.yaml
  vars:
    container_name: mysql

  tasks:
    - name: Extract MySQL root password from environment and create user
      shell: >
        MYSQL_PWD=$(docker exec {{ container_name }} printenv | grep MYSQL_ROOT_PASSWORD | cut -d '=' -f2) &&
        docker exec -i {{ container_name }} mysql -uroot -p"$MYSQL_PWD" -e "
          CREATE USER IF NOT EXISTS 'data-analyzer'@'%' IDENTIFIED WITH 'mysql_native_password' BY 'd@t@-@n@lyzer!';
          GRANT SELECT ON yovo_db_cc.* TO 'data-analyzer'@'%';
        "
